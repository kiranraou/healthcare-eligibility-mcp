name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build image
        run: docker build -t healthcare-eligibility-mcp .
      - name: Start container
        run: docker run -d --name mcp -p 8000:8000 healthcare-eligibility-mcp
      - name: Smoke test MCP over HTTP
        run: |
          for i in $(seq 1 30); do
            python scripts/smoke_test.py http://localhost:8000/mcp && exit 0
            sleep 1
          done
          docker logs mcp
          exit 1
